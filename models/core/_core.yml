version: 2

models:
  - name: dim_date
    description: "date dimension 2023-2026"
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: dim_studio
    description: "studio dimension, SCD type 1"
    columns:
      - name: studio_key
        tests: [unique, not_null]

  - name: dim_member
    description: "member dimension as SCD type 2. One line per member and contract"
    columns:
      - name: member_key
        description: "surrogate key: member_id and valid_from."
        tests: [unique, not_null]
      - name: member_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]
      - name: plan
        tests:
          - accepted_values:
              arguments:
                values: ["basic", "plus", "premium"]

  - name: fct_checkin
    description: "fact table, grain: studio visit"
    columns:
      - name: checkin_id
        tests: [unique, not_null]
      - name: member_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_member')
              field: member_key
      - name: studio_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_studio')
              field: studio_key